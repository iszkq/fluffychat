<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Office Editor</title>
  <style>
    html, body { width: 100%; min-width: 100%; height: 100%; min-height: 100dvh; margin: 0; border: 0; overflow: hidden; background: #f5f5f5; }
    #editor { display: block; width: 100vw; min-width: 100%; height: 100%; min-height: 100dvh; margin: 0; border: 0; overflow: hidden; background: #f5f5f5; }
  </style>
</head>
<body>
  <iframe id="editor" title="Office editor" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
  <script>
    (() => {
      'use strict';
      const frame = document.getElementById('editor');
      let config = null;
      let editorOrigin = null;

      const parseMessage = (value) => {
        if (typeof value === 'string') {
          try { return JSON.parse(value); } catch (_) { return null; }
        }
        return value && typeof value === 'object' ? value : null;
      };

      const emit = (message) => {
        const payload = JSON.stringify(message);
        if (window.FluffyOfficeBridge && typeof window.FluffyOfficeBridge.postMessage === 'function') {
          window.FluffyOfficeBridge.postMessage(payload);
        } else if (window.parent !== window && config && config.parentOrigin) {
          window.parent.postMessage(payload, config.parentOrigin);
        }
      };

      const localizedError = (zh, en) =>
        config && String(config.lang || '').toLowerCase().startsWith('zh') ? zh : en;

      const base64ToArrayBuffer = (value) => {
        const encoded = value.includes(',') ? value.slice(value.indexOf(',') + 1) : value;
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return bytes.buffer;
      };

      const normalizeSavedBuffer = async (value) => {
        if (value instanceof ArrayBuffer) return value;
        if (ArrayBuffer.isView(value)) {
          return value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength);
        }
        if (typeof SharedArrayBuffer !== 'undefined' && value instanceof SharedArrayBuffer) {
          return Uint8Array.from(new Uint8Array(value)).buffer;
        }
        if (typeof Blob !== 'undefined' && value instanceof Blob) return value.arrayBuffer();
        if (typeof value === 'string') return base64ToArrayBuffer(value);
        if (Array.isArray(value)) return Uint8Array.from(value).buffer;
        if (value && value.type === 'Buffer' && Array.isArray(value.data)) {
          return Uint8Array.from(value.data).buffer;
        }
        if (value && typeof value === 'object') {
          const numericKeys = Object.keys(value).filter((key) => /^\d+$/.test(key));
          if (numericKeys.length > 0) {
            numericKeys.sort((left, right) => Number(left) - Number(right));
            return Uint8Array.from(numericKeys.map((key) => value[key])).buffer;
          }
        }
        throw new Error(localizedError(
          'Office 编辑服务未返回可保存的文档数据',
          'The Office editor did not return savable document data.'
        ));
      };

      const emitSaved = async (message) => {
        const buffer = await normalizeSavedBuffer(message.buffer ?? message.blob ?? message.data);
        const bytes = new Uint8Array(buffer);
        if (bytes.byteLength === 0) {
          throw new Error(localizedError(
            'Office 编辑服务返回了空文档',
            'The Office editor returned an empty document.'
          ));
        }
        const chunkSize = 48 * 1024;
        const chunkCount = Math.ceil(bytes.byteLength / chunkSize);
        emit({
          type: 'fluffy-office-saved-begin',
          requestId: config.requestId,
          saveId: message.saveId,
          fileName: message.fileName,
          mimeType: message.mimeType,
          byteLength: bytes.byteLength,
          chunkCount
        });
        for (let index = 0; index < chunkCount; index += 1) {
          const slice = bytes.subarray(index * chunkSize, Math.min(bytes.byteLength, (index + 1) * chunkSize));
          let binary = '';
          for (let offset = 0; offset < slice.length; offset += 0x2000) {
            binary += String.fromCharCode(...slice.subarray(offset, Math.min(slice.length, offset + 0x2000)));
          }
          emit({
            type: 'fluffy-office-saved-chunk',
            requestId: config.requestId,
            saveId: message.saveId,
            chunkIndex: index,
            chunkData: btoa(binary)
          });
          await new Promise((resolve) => setTimeout(resolve, 0));
        }
        emit({
          type: 'fluffy-office-saved-end',
          requestId: config.requestId,
          saveId: message.saveId
        });
      };

      const initialize = (message) => {
        if (!message.requestId || !message.editorUrl || !message.parentOrigin) return;
        config = message;
        try {
          const editorUrl = new URL(message.editorUrl);
          editorOrigin = editorUrl.origin;
          const editor = new URL('/editor', editorUrl);
          editor.searchParams.set('embed', '1');
          editor.searchParams.set('requestId', message.requestId);
          editor.searchParams.set('parentOrigin', window.location.origin);
          editor.searchParams.set('editing', message.editing === false ? '0' : '1');
          editor.searchParams.set('lang', message.lang || 'zh-CN');
          editor.searchParams.set('theme', message.theme || 'light');
          const mobile = message.mobile === true ||
            (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
            /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
          editor.searchParams.set('mobile', mobile ? '1' : '0');
          // The compact toolbar reserves a fixed-width mobile canvas in an
          // embedded WebView. Let the editor use its responsive toolbar so
          // the document can occupy the full viewport instead.
          frame.src = editor.toString();
        } catch (error) {
          emit({ type: 'xinghuo-office-error', requestId: message.requestId, message: String(error) });
        }
      };

      const receive = (raw) => {
        const message = parseMessage(raw);
        if (!message) return;
        if (message.type === 'fluffy-office-init') {
          initialize(message);
          return;
        }
        if (!config || message.requestId !== config.requestId || !frame.contentWindow || !editorOrigin) return;
        frame.contentWindow.postMessage(message, editorOrigin);
      };

      window.fluffyOfficeReceive = receive;
      window.addEventListener('message', (event) => {
        const message = parseMessage(event.data);
        if (!message) return;
        if (!config) {
          if (event.source === window.parent && message.type === 'fluffy-office-init') receive(message);
          return;
        }
        if (event.source === window.parent && event.origin === config.parentOrigin) {
          receive(message);
          return;
        }
        if (event.source !== frame.contentWindow || event.origin !== editorOrigin || message.requestId !== config.requestId) return;
        if (message.type === 'xinghuo-office-saved') {
          emitSaved(message).catch((error) => emit({
            type: 'xinghuo-office-error',
            requestId: config.requestId,
            saveId: message.saveId,
            message: error instanceof Error ? error.message : String(error)
          }));
          return;
        }
        emit(message);
      });
    })();
  </script>
</body>
</html>
