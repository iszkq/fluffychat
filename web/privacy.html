    <h1>隐私说明</h1>
    <p>本服务是基于 Matrix 协议的 FluffyChat 客户端。聊天内容由用户选择的 Matrix 服务器处理，并受相应服务器隐私政策约束。</p>
    <p>仅当用户主动点击“语音转文字”时，对应音频才会发送到站点配置的 AIHubMix 转录服务，用于生成文字。请勿对不希望发送给第三方的音频使用该功能。</p>
    <p>客户端不会在公开网页资源中保存语音转文字服务的 API 密钥。</p>
