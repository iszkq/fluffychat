name: Build Mobile Packages

on:
  workflow_dispatch:
    inputs:
      voice_transcription_endpoint:
        description: Full Cloudflare URL ending in /api/transcribe
        required: true
        default: https://flchat.221819.best/api/transcribe
        type: string
      office_editor_url:
        description: Office editor base URL (HTTPS, without /editor)
        required: true
        default: https://124.222.193.241:6258
        type: string

permissions:
  contents: read

jobs:
  android_apk:
    name: Android background-sync APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/free_up_space

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify synchronized code and fork regressions
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib
          flutter test --timeout 2m test/pages/chat/send_file_dialog_test.dart \
            test/pages/chat/read_marker_test.dart test/push_summary_test.dart \
            test/pages/chat/sticker_repository_test.dart \
            test/voice_message_caf_converter_test.dart \
            test/normalize_camera_image_test.dart \
            test/ios_camera_test.dart \
            test/android_background_notifications_mode_test.dart \
            test/deep_links_test.dart test/notification_launch_handler_test.dart \
            test/settings_reset_test.dart test/retire_legacy_ios_push_test.dart \
            test/database_recovery_test.dart test/rtc_discovery_test.dart

      - name: Configure stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing ${variable} repository secret. Stable release signing is required so future APKs can update in place."
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "${ANDROID_STORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=release.keystore\n'
          } > android/key.properties

      - name: Build installable background-sync APK
        env:
          VOICE_TRANSCRIPTION_ENDPOINT: ${{ inputs.voice_transcription_endpoint }}
          OFFICE_EDITOR_URL: ${{ inputs.office_editor_url }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          build_number=$((300000 + GITHUB_RUN_NUMBER))
          flutter build apk \
            --release \
            --build-number="${build_number}" \
            --target-platform android-arm,android-arm64 \
            --dart-define="VOICE_TRANSCRIPTION_ENDPOINT=${VOICE_TRANSCRIPTION_ENDPOINT}" \
            --dart-define="OFFICE_EDITOR_URL=${OFFICE_EDITOR_URL}"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk fluffychat-android-background-sync.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-android-background-sync
          path: fluffychat-android-background-sync.apk
          retention-days: 14

  ios_unsigned_ipa:
    name: iOS unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select --switch /Applications/Xcode_26.2.app

      - name: Install native dependencies
        run: brew install sqlcipher

      - name: Test native camera orientation and Chinese controls
        run: bash scripts/test-ios-camera.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Validate iOS project
        run: plutil -lint ios/Runner.xcodeproj/project.pbxproj ios/Runner/Info.plist

      - name: Verify camera and voice playback regressions
        run: >-
          flutter test --timeout 2m
          test/ios_camera_test.dart
          test/pages/chat/send_file_dialog_test.dart
          test/voice_message_caf_converter_test.dart
          test/deep_links_test.dart
          test/notification_launch_handler_test.dart
          test/retire_legacy_ios_push_test.dart
          test/settings_reset_test.dart
          test/database_recovery_test.dart
          test/rtc_discovery_test.dart

      - name: Build iOS app without signing
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VOICE_TRANSCRIPTION_ENDPOINT: ${{ inputs.voice_transcription_endpoint }}
          OFFICE_EDITOR_URL: ${{ inputs.office_editor_url }}
        run: >-
          flutter build ios
          --release
          --no-codesign
          --build-number=$((300000 + GITHUB_RUN_NUMBER))
          --dart-define="VOICE_TRANSCRIPTION_ENDPOINT=${VOICE_TRANSCRIPTION_ENDPOINT}"
          --dart-define="OFFICE_EDITOR_URL=${OFFICE_EDITOR_URL}"

      - name: Verify packaged camera and record build identity
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          app = pathlib.Path('build/ios/iphoneos/Runner.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          expected_build = str(300000 + int(os.environ['GITHUB_RUN_NUMBER']))
          assert info['CFBundleVersion'] == expected_build, 'iOS build number was not applied'
          binary = (app / info['CFBundleExecutable']).read_bytes()
          assert b'im.fluffychat/ios_camera' in binary, 'Native camera missing from built app'
          pathlib.Path('ios-build-info.txt').write_text(
              f"Commit: {os.environ['GITHUB_SHA']}\n"
              f"Version: {info['CFBundleShortVersionString']}\n"
              f"Build: {info['CFBundleVersion']}\n"
              "Camera: AVFoundation with app-localized review controls\n"
          )
          print(pathlib.Path('ios-build-info.txt').read_text())
          PY

      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned-ipa/Payload/
          cd build/unsigned-ipa
          zip -qry ../../fluffychat-ios-unsigned.ipa Payload

      - name: Save Swift Package diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-swift-package-diagnostics
          path: |
            ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
            ios/Flutter/ephemeral/Packages/.packages/FlutterFramework/Package.swift
            ios/Runner.xcodeproj/project.pbxproj
          include-hidden-files: true
          retention-days: 7

      - name: Package SideStore-compatible IPA
        run: |
          mkdir -p build/sideload-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/sideload-ipa/Payload/
          rm -rf build/sideload-ipa/Payload/Runner.app/PlugIns
          cd build/sideload-ipa
          zip -qry ../../fluffychat-ios-sideload.ipa Payload

      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-ios-unsigned
          path: |
            fluffychat-ios-unsigned.ipa
            ios-build-info.txt
          retention-days: 14

      - name: Upload SideStore package
        uses: actions/upload-artifact@v7
        with:
          name: fluffychat-ios-sideload
          path: |
            fluffychat-ios-sideload.ipa
            ios-build-info.txt
          retention-days: 14
