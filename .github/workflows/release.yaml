name: Verify Release Notes

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Verify release matches committed Chinese notes
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          release = event['release']
          tag = release['tag_name']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Release tag must be vX.Y.Z'
          notes = pathlib.Path('docs/releases', tag + '.md').read_text(encoding='utf-8').strip()
          assert notes == (release['body'] or '').strip(), 'Release notes differ from committed notes'
          version = re.search(r'^version: ([^+\s]+)', pathlib.Path('pubspec.yaml').read_text(encoding='utf-8'), re.M).group(1)
          assert tag == 'v' + version, 'Release tag differs from app version'
          print(f'Verified {tag} and its Chinese release notes.')
          PY
