name: Build and Publish Release Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build
      - run: flutter pub get --enforce-lockfile
      - name: Check version and release notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          grep -Fx "version: ${version}" pubspec.yaml
          test -f "docs/releases/${RELEASE_TAG}.md"
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - run: flutter test --timeout 2m test/update_notifier_test.dart
      - name: Build encryption library for transport regression tests
        shell: bash
        run: |
          crypto_root="$(python3 -c 'import json, pathlib, urllib.parse; p=next(p for p in json.load(open(".dart_tool/package_config.json"))["packages"] if p["name"]=="flutter_vodozemac"); print(pathlib.Path(urllib.parse.unquote(urllib.parse.urlparse(p["rootUri"]).path))/"rust")')"
          cargo build --release --manifest-path "$crypto_root/Cargo.toml" --target-dir "$RUNNER_TEMP/mention-crypto"
          echo "MENTION_TEST_VODOZEMAC_DIR=$RUNNER_TEMP/mention-crypto/release/" >> "$GITHUB_ENV"
      - name: Verify mentions, encrypted transport, permissions and rendering
        run: flutter test --no-pub --reporter expanded test/room_mention_test.dart test/room_mention_delivery_test.dart test/room_mention_rendering_test.dart

  android:
    name: Android APK and AAB
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/free_up_space
        with:
          target: android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            test -n "${!variable}" || { echo "Missing ${variable}"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=release.keystore\n'
          } > android/key.properties
      - name: Build signed Android packages
        run: |
          version="${RELEASE_TAG#v}"
          build_number=$((300000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name="$version" --build-number="$build_number" --target-platform android-arm,android-arm64
          flutter build appbundle --release --build-name="$version" --build-number="$build_number"
          cp build/app/outputs/flutter-apk/app-release.apk fluffychat-3.0.1-android.apk
          cp build/app/outputs/bundle/release/app-release.aab fluffychat-3.0.1-android.aab
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: fluffychat-3.0.1-android.*

  ios:
    name: iOS unsigned IPA
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_26.2.app
      - run: brew install sqlcipher
      - run: flutter config --enable-swift-package-manager
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build and package unsigned and sideload IPAs
        run: |
          version="${RELEASE_TAG#v}"
          build_number=$((300000 + GITHUB_RUN_NUMBER))
          flutter build ios --release --no-codesign --build-name="$version" --build-number="$build_number"
          mkdir -p build/unsigned-ipa/Payload build/sideload-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/unsigned-ipa/Payload/
          cp -R build/ios/iphoneos/Runner.app build/sideload-ipa/Payload/
          rm -rf build/sideload-ipa/Payload/Runner.app/PlugIns
          (cd build/unsigned-ipa && zip -qry ../../fluffychat-3.0.1-ios-unsigned.ipa Payload)
          (cd build/sideload-ipa && zip -qry ../../fluffychat-3.0.1-ios-sideload.ipa Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            fluffychat-3.0.1-ios-unsigned.ipa
            fluffychat-3.0.1-ios-sideload.ipa

  windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ilammy/setup-nasm@v1
      - name: Read pinned Flutter version without Chocolatey
        shell: pwsh
        run: |
          $config = Get-Content .tool_versions.yaml -Raw
          $match = [regex]::Match($config, '(?m)^\s*flutter:\s*([0-9.]+)')
          if (-not $match.Success) { throw 'Flutter version not found' }
          "FLUTTER_VERSION=$($match.Groups[1].Value)" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Build Windows with diagnostic log
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $buildNumber = 300000 + [int]$env:GITHUB_RUN_NUMBER
          flutter build windows --release --build-name=$version --build-number=$buildNumber -v 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fluffychat-3.0.1-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: fluffychat-3.0.1-windows-x64.zip
      - name: Upload Windows diagnostic log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-log
          path: windows-build.log

  macos:
    name: macOS x64 app
    needs: verify
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - run: brew install sqlcipher
      - run: flutter config --enable-swift-package-manager
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Use portable webcrypto implementation on macOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          package = Path(os.environ['HOME']) / '.pub-cache/hosted/pub.dev/webcrypto-0.6.1/src/CMakeLists.txt'
          source = package.read_text()
          marker = 'include(\n  ../third_party/boringssl/sources.cmake\n)'
          replacement = marker + '''

          if(CMAKE_SYSTEM_NAME STREQUAL "Darwin")
            add_definitions(-DOPENSSL_NO_ASM)
            set(crypto_sources_${PLATFORM}_${ARCH})
          endif()
          '''
          if marker not in source:
              raise SystemExit('webcrypto CMake source layout changed')
          package.write_text(source.replace(marker, replacement, 1))
          PY
      - name: Generate macOS build configuration
        run: flutter build macos --release --config-only
      - name: Build unsigned macOS app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee macos-build.log
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/FluffyChat.app fluffychat-3.0.1-macos-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: fluffychat-3.0.1-macos-x64.zip
      - name: Upload macOS diagnostic log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-log
          path: macos-build.log

  linux:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libjsoncpp-dev libsecret-1-dev libsecret-1-0 librhash0 libssl-dev libwebkit2gtk-4.1-dev libpulse-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf fluffychat-3.0.1-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: fluffychat-3.0.1-linux-x64.tar.gz

  web:
    name: Web package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .tool_versions.yaml
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install web build tools
        run: |
          rustup toolchain install nightly-x86_64-unknown-linux-gnu --profile minimal --component rust-src
          curl --fail --silent --show-error --location https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 --output "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: flutter config --enable-web --no-analytics
      - run: flutter precache --web
      - run: flutter pub get
      - run: ./scripts/prepare-web.sh
      - run: flutter build web --release --dart-define=FLUTTER_WEB_CANVASKIT_URL=canvaskit/
      - run: cp config.sample.json build/web/config.json
      - run: cd build/web && zip -qr ../../fluffychat-3.0.1-web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: fluffychat-3.0.1-web.zip

  publish:
    name: Publish GitHub Release
    needs: [android, ios, windows, macos, linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "FluffyChat ${RELEASE_TAG#v}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --title "FluffyChat ${RELEASE_TAG#v}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
